<main>
  <article>
    <h1>Euler's identity</h1>
    <p>Euler's identity relates five constants:</p>
    <span class="katex">
      <span class="katex-mathml">
        <math><semantics><mrow><msup><mi>e</mi></mrow></mrow>
        <annotation encoding="application/x-tex">e^{i\pi} + 1 = 0</annotation></semantics></math>
      </span>
      <span class="katex-html" aria-hidden="true"><span class="base">e</span><span>iπ</span><span>+1=0</span></span>
    </span>
    <p>It is a special case of the formula below.</p>
    <math><semantics><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow>
    <annotation encoding="application/x-tex">a+b</annotation></semantics></math>
  </article>
</main>
